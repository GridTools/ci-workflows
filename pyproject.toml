# Development tooling only (ruff, mypy, pytest). This repository ships no
# Python package: the agent review's code in agent-review/lib/ runs with the
# runner's /usr/bin/python3 and the standard library only
# (docs/adr/0004-python-runtime.md).

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF", "SIM", "PL"]
ignore = [
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR2004", # magic values in comparisons
]

[tool.ruff.lint.per-file-ignores]
# Tests run tools as subprocesses and use assert; the structure checks run git.
"agent-review/tests/**" = ["S101", "S603", "S607", "S108", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["agent_review", "workflow_structure"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = ["agent-review/lib", "agent-review/tests"]
files = ["agent-review/lib", "agent-review/tests/python", "agent-review/tests/workflow_structure.py"]

[tool.pytest.ini_options]
testpaths = ["agent-review/tests/python"]
pythonpath = ["agent-review/lib", "agent-review/tests"]
# No .pytest_cache in the tree; run with 'python -B' so that no __pycache__
# is written either (the structure test forbids both in agent-review/).
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider", "--strict-markers", "-ra"]
