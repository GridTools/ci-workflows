# Run with: pre-commit run --all-files (or 'uvx pre-commit run --all-files').
# Hook revisions are pinned by commit SHA, with the tag as a comment.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        # Info-level notes (quoting in test assertions, sourced helpers) are
        # not failures.
        args: [--severity=warning]
  # The agent review's Python code (agent-review/lib/, tests). Entry points in
  # bin/ have no '.py' suffix and are checked against their fixed template
  # by the structure test instead.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  # The runtime code only, which has no dependency; the self-test's 'python'
  # job also checks the tests, with the hash-pinned requirements.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # frozen: v2.4.1
    hooks:
      - id: mypy
        files: ^agent-review/lib/
        pass_filenames: false
        args: [--config-file=pyproject.toml, agent-review/lib]
