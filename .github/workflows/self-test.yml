name: Self-test

# This repository's own CI: lint, zizmor, the agent review's script and
# structure tests, its Python tests, and the whole agent review pipeline end
# to end with the 'stub' harness (the keyless job: no environment, no key,
# no model call, nothing posted) through a LOCAL call, so the commit under
# test is exactly the one whose files the pipeline fetches. The fixed
# fixture is a merged public GT4Py pull request whose head is in a fork and
# which changes AGENTS.md, so the cross-repository fetch by sha and the
# instruction-file reset run for real.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to notice drift in the runner image, AWF or the fixture.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Head of the fixture (GridTools/gt4py PR 2983, set in the 'e2e' inputs).
  FIXTURE_HEAD_SHA: 46e9c4f3cecc6571b36b219994f8b126602513ff

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, shellcheck and file checks, hooks pinned by commit sha.
      - name: pre-commit
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

  # Static security audit of the workflows. Online audits (impostor commits,
  # known-vulnerable actions, ref confusion) use the read-only token.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --format plain .github/workflows

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 'test-run-review' needs github.com (it fetches the fixture); the
      # others are offline.
      - name: Script tests
        run: |
          rc=0
          for t in test-authorize test-collect-result test-publish-comment test-instruction-coverage test-run-review; do
            echo "::group::${t}"
            bash "agent-review/tests/${t}.sh" || rc=1
            echo "::endgroup::"
          done
          exit "${rc}"
      # The workflow's structural invariants (environment, secrets,
      # permissions, expressions in scripts, the keyless twin).
      - name: Workflow structure
        run: python3 agent-review/tests/test-workflow-structure.py

  # The agent review's Python code (docs/adr/0003-python-runtime.md): unit
  # tests, the entry points under the production command line in a hostile
  # environment, the structure checks on crafted inputs, and mypy. pytest and
  # mypy are test-only tools from a hash-pinned requirements file, in a
  # virtual environment; the runtime code never imports them.
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the test tools
        run: |
          /usr/bin/python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --require-hashes --no-deps --only-binary :all: \
            -r agent-review/tests/requirements.txt
      - name: pytest
        run: '"${RUNNER_TEMP}/venv/bin/python" -B -m pytest'
      - name: mypy
        run: '"${RUNNER_TEMP}/venv/bin/python" -m mypy'

  # The model-calling adapters' installers, as the 'prepare' job runs them:
  # pinned versions with integrity checks, no install scripts, no harness
  # code executed (the version check runs inside the sandbox).
  adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        harness: [opencode, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ${{ matrix.harness }}
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          prefix="${RUNNER_TEMP}/harness"
          bash "agent-review/harnesses/${HARNESS}/install.sh" "${prefix}"
          version=$(head -n 1 "${prefix}/VERSION")
          echo "${HARNESS} ${version}"
          [[ "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]
          [ "$(head -n 1 "agent-review/harnesses/${HARNESS}/wire")" = openai-chat ]

  # The stub runs in the keyless job: no environment is requested, so no
  # deployment is recorded and the commit needs no deployment rule. '$/' would
  # do the same; './' keeps the call readable for older tooling.
  e2e:
    uses: ./.github/workflows/agent-review.yml # zizmor: ignore[self-repository]
    # The ceiling for the called jobs, as in a real caller.
    permissions:
      contents: read
      pull-requests: write
    with:
      harness: stub
      pr: "2983"
      test_repository: GridTools/gt4py
      dry_run: true
      project_name: GT4Py
      rule_files: |
        .github/copilot-instructions.md
        AGENTS.md
        CODING_GUIDELINES.md
        src/gt4py/next/AGENTS.md
      prompt_addendum: .github/agent-review-selftest/prompt-addendum.md
      # Lowered caps, to exercise the clamping.
      requests_per_hour: 10
      max_turns: 5
      harness_timeout_minutes: 5

  check:
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reads this run's jobs, the keyless review's log and annotations, and
    # the commit's deployments; nothing is written.
    permissions:
      actions: read
      checks: read
      deployments: read
    steps:
      - name: The stub review of the fixture was rendered, not posted
        env:
          E2E: ${{ needs.e2e.result }}
          RESULT: ${{ needs.e2e.outputs.result }}
          HEAD_SHA: ${{ needs.e2e.outputs.head_sha }}
          COMMENT_URL: ${{ needs.e2e.outputs.comment_url }}
        run: |
          echo "e2e='${E2E}' result='${RESULT}' head_sha='${HEAD_SHA}' comment_url='${COMMENT_URL}'"
          [ "${E2E}" = success ] && [ "${RESULT}" = dry-run ] && [ "${HEAD_SHA}" = "${FIXTURE_HEAD_SHA}" ] && [ -z "${COMMENT_URL}" ]

      # 'Publish the review' in agent-review.yml runs only for a real post,
      # which the self-test never makes: check on the same runner image that
      # its fixed PATH finds the runner's gh.
      - name: The publish step's fixed PATH finds gh
        env:
          PATH: /usr/bin:/bin
        run: |
          gh_path=$(command -v gh)
          echo "gh under PATH=${PATH}: ${gh_path}"
          [ "${gh_path}" = /usr/bin/gh ]
          gh --version

      - name: The keyless job ran the sandbox as configured
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          # Deployments record the PR head, not the merge commit.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ok=true
          expect() { # message command...
            local msg=$1; shift
            if "$@"; then echo "ok    ${msg}"; else echo "::error::FAIL  ${msg}"; ok=false; fi
          }
          jobs=$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs" --jq '.jobs[]' | jq -s .)
          job() { jq -r --arg n "$1" --arg f "$2" '.[] | select(.name == $n) | .[$f]' <<< "${jobs}"; }
          step() { jq -r --arg n "$1" --arg s "$2" '.[] | select(.name == $n) | .steps[] | select(.name == $s) | .conclusion' <<< "${jobs}"; }
          expect "the keyed job did not run" test "$(job 'e2e / review' conclusion)" = skipped
          expect "the keyless job succeeded" test "$(job 'e2e / review-keyless' conclusion)" = success
          expect "nothing was posted" test "$(step 'e2e / publish' 'Publish the review')" = skipped

          # The raw logs, through curl: they hold escape sequences, which 'gh'
          # refuses to print. curl drops the token on the redirect to storage.
          fetch_log() { # job-name file
            local id
            id=$(job "$1" id)
            [[ "${id}" =~ ^[0-9]+$ ]] || { echo "::error::No job '$1'."; exit 1; }
            for i in 1 2 3 4 5; do
              curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${REPO}/actions/jobs/${id}/logs" | tr -d '\r' > "$2" && break
              sleep $((i * 5))
            done
          }
          log="${RUNNER_TEMP}/review.log"
          prepare_log="${RUNNER_TEMP}/prepare.log"
          fetch_log 'e2e / review-keyless' "${log}"
          fetch_log 'e2e / prepare' "${prepare_log}"
          expect "fetch run allows only github.com" grep -qE '^[^ ]+ awf\| \[INFO\] Allowed domains: github\.com$' "${log}"
          expect "review run allows no domain" grep -qE '^[^ ]+ awf\| \[INFO\] Allowed domains: ?$' "${log}"
          expect "caps clamped" grep -qF '{"rateLimiting":{"requestsPerMinute":30,"requestsPerHour":10},"maxTurns":5,"agentTimeout":10}' "${log}"
          expect "no key reached AWF" test "$(grep -c 'API proxy enabled: OpenAI=true' "${log}")" -eq 0
          expect "the reset was verified" grep -qF 'are their base versions.' "${log}"

          # The Python runtime (bin/probe, run by the stub harness): on the
          # host in 'prepare' and inside the sandbox, the same interpreter,
          # with the production flags and the standard library only.
          probe='agent-review-probe python=3\.12\.[0-9]+ executable=/usr/bin/python3 isolated=1 ignore_environment=1'
          probe+=' no_user_site=1 no_site=1 dont_write_bytecode=1 safe_path=1 site=0 stdlib_only=1'
          host=$(grep -E "^[^ ]+ ${probe} lib=/[^ ]+/trusted/lib$" "${prepare_log}" | cut -d' ' -f2- || true)
          sandbox=$(grep -E "^[^ ]+ awf\| ${probe} lib=/opt/agent-review/lib$" "${log}" | cut -d' ' -f3- || true)
          echo "host:    ${host}"
          echo "sandbox: ${sandbox}"
          expect "Python on the host (prepare)" test "$(wc -l <<< "${host}")" -eq 1 -a -n "${host}"
          expect "Python in the sandbox" test "$(wc -l <<< "${sandbox}")" -eq 1 -a -n "${sandbox}"
          expect "the same Python version on both" test "$(cut -d' ' -f2 <<< "${host}")" = "$(cut -d' ' -f2 <<< "${sandbox}")"

          # Sandbox output issues no workflow command in the legacy syntax
          # either (invariant 11): the stub prints the probe on stdout and
          # through 'diag'; neither may become an annotation of the job.
          expect "the legacy-command probe ran (stdout and diag)" \
            test "$(grep -c 'agent-review-legacy-probe' "${log}")" -ge 2
          check_run=$(job 'e2e / review-keyless' check_run_url)
          [[ "${check_run}" =~ ^https://api\.github\.com/(repos/[^/]+/[^/]+/check-runs/[0-9]+)$ ]] ||
            { echo "::error::No check run for the keyless job."; exit 1; }
          n=$(gh api --paginate "${BASH_REMATCH[1]}/annotations" \
            --jq '.[] | select(.message | contains("agent-review-legacy-probe")) | .message' | wc -l)
          expect "no annotation from the legacy-command probe (${n})" test "${n}" -eq 0

          # The keyless job requests no environment, so no deployment.
          n=$(gh api "repos/${REPO}/deployments?sha=${COMMIT}" --jq length)
          expect "no deployment for ${COMMIT}" test "${n}" -eq 0
          [ "${ok}" = true ]
