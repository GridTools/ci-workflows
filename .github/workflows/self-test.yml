name: Self-test

# This repository's own CI: lint, zizmor, the script and structure tests of
# both workflows, PR Agent's keyless path (dry run), and the whole agent
# review pipeline end to end with the
# 'stub' harness (the keyless job: no environment, no key, no model call,
# nothing posted) through a LOCAL call, so the commit under test is exactly
# the one whose files the pipeline fetches. The fixed fixture is a
# merged public pull request of another repository whose head is in a fork
# and which changes AGENTS.md at two depths, so the cross-repository fetch by sha and the instruction-file
# reset run for real.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to notice drift in the runner image, AWF or the fixture.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Head of the agent review's fixture (set in the 'e2e' inputs).
  FIXTURE_HEAD_SHA: 46e9c4f3cecc6571b36b219994f8b126602513ff
  # Head of PR Agent's fixture (this repository's PR 1, set in the
  # 'pr-agent-e2e' inputs).
  PR_AGENT_FIXTURE_HEAD_SHA: b259354abbac0ccabffb1bf027d71fa66f0385a8

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, shellcheck and file checks, hooks pinned by commit sha.
      - name: pre-commit
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure

  # Static security audit of the workflows. Online audits (impostor commits,
  # known-vulnerable actions, ref confusion) use the read-only token.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --format plain .github/workflows

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 'test-run-review' needs github.com (it fetches the fixture); the
      # others are offline.
      - name: Script tests
        run: |
          rc=0
          for t in test-authorize test-collect-result test-publish-comment test-instruction-coverage test-run-review; do
            echo "::group::${t}"
            bash "agent-review/tests/${t}.sh" || rc=1
            echo "::endgroup::"
          done
          exit "${rc}"
      # The workflow's structural invariants (environment, secrets,
      # permissions, expressions in scripts, the keyless twin).
      - name: Workflow structure
        run: python3 agent-review/tests/test-workflow-structure.py
      # Offline.
      - name: PR Agent script tests
        run: |
          rc=0
          for t in test-authorize test-resolve-models test-report-outcome; do
            echo "::group::${t}"
            bash "pr-agent/tests/${t}.sh" || rc=1
            echo "::endgroup::"
          done
          echo "::group::test-workflow-structure"
          python3 pr-agent/tests/test-workflow-structure.py || rc=1
          echo "::endgroup::"
          exit "${rc}"
      # The dry run never pulls the image, so a mistyped digest would show
      # only in a caller's run. Also reports whether the tag has moved.
      - name: PR Agent image pin exists
        run: |
          set -euo pipefail
          ref=$(grep -oE 'docker://pragent/pr-agent@sha256:[0-9a-f]{64}' .github/workflows/pr-agent.yml)
          digest=${ref#*@}
          tag=$(grep -oE "Tag '[^']+'" .github/workflows/pr-agent.yml | cut -d"'" -f2)
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:pragent/pr-agent:pull" | jq -r .token)
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          resolve() {
            curl -fsSI -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
              "https://registry-1.docker.io/v2/pragent/pr-agent/manifests/$1" |
              tr -d '\r' | sed -n 's/^docker-content-digest: //Ip'
          }
          [ "$(resolve "${digest}")" = "${digest}" ] || { echo "::error::pragent/pr-agent@${digest} does not exist."; exit 1; }
          now=$(resolve "${tag}")
          if [ "${now}" = "${digest}" ]; then
            echo "Tag '${tag}' is ${digest}."
          else
            echo "::warning::Tag '${tag}' now points to '${now}', not the pinned '${digest}'."
          fi

  # The model-calling adapters' installers, as the 'prepare' job runs them:
  # pinned versions with integrity checks, no install scripts, no harness
  # code executed (the version check runs inside the sandbox).
  adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        harness: [opencode, pi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ${{ matrix.harness }}
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          prefix="${RUNNER_TEMP}/harness"
          bash "agent-review/harnesses/${HARNESS}/install.sh" "${prefix}"
          version=$(head -n 1 "${prefix}/VERSION")
          echo "${HARNESS} ${version}"
          [[ "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]
          [ "$(head -n 1 "agent-review/harnesses/${HARNESS}/wire")" = openai-chat ]

  # PR Agent's keyless path: 'authorize' and 'Resolve models' against a
  # fixed public PR, dry run forced by 'test_pr'; the 'pr-agent' job (the
  # only one with the environment and the key) and 'report' are skipped.
  pr-agent-e2e:
    uses: ./.github/workflows/pr-agent.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      model: zai-org/GLM-5.3-Flash
      fallback_models: "Qwen/Qwen3.8-Flash-Next-FP8, Qwen/Qwen3.8-27B-FP8"
      ai_timeout: "600"
      docs_url: https://github.com/GridTools/ci-workflows/blob/main/docs/pr-agent.md#testing-changes
      test_pr: GridTools/ci-workflows#1

  pr-agent-check:
    needs: pr-agent-e2e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      deployments: read
    steps:
      - name: The dry run authorized and resolved, and ran nothing keyed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          E2E: ${{ needs.pr-agent-e2e.result }}
          RESULT: ${{ needs.pr-agent-e2e.outputs.result }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ok=true
          expect() { # message command...
            local msg=$1; shift
            if "$@"; then echo "ok    ${msg}"; else echo "::error::FAIL  ${msg}"; ok=false; fi
          }
          expect "e2e '${E2E}', result '${RESULT}'" test "${E2E}/${RESULT}" = success/dry-run
          jobs=$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs" --jq '.jobs[]' | jq -s .)
          job() { jq -r --arg n "$1" --arg f "$2" '.[] | select(.name == $n) | .[$f]' <<< "${jobs}"; }
          step() { jq -r --arg n "$1" --arg s "$2" '.[] | select(.name == $n) | .steps[] | select(.name == $s) | .conclusion' <<< "${jobs}"; }
          expect "authorize succeeded" test "$(job 'pr-agent-e2e / authorize' conclusion)" = success
          expect "models resolved" test "$(step 'pr-agent-e2e / authorize' 'Resolve models')" = success
          expect "the keyed job did not run" test "$(job 'pr-agent-e2e / pr-agent' conclusion)" = skipped
          expect "nothing was reported" test "$(job 'pr-agent-e2e / report' conclusion)" = skipped

          id=$(job 'pr-agent-e2e / authorize' id)
          [[ "${id}" =~ ^[0-9]+$ ]] || { echo "::error::No authorize job."; exit 1; }
          for i in 1 2 3 4 5; do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/actions/jobs/${id}/logs" | tr -d '\r' > "${RUNNER_TEMP}/authorize.log" && break
            sleep $((i * 5))
          done
          log="${RUNNER_TEMP}/authorize.log"
          expect "the fixture was resolved" grep -qF "Self-test against GridTools/ci-workflows#1 at ${PR_AGENT_FIXTURE_HEAD_SHA}" "${log}"
          expect "the chain was derived" grep -qF "Model 'openai/zai-org/GLM-5.3-Flash', fallbacks [\"openai/Qwen/Qwen3.8-Flash-Next-FP8\",\"openai/Qwen/Qwen3.8-27B-FP8\"]; context window 262144, output reserve 100000, 600 s per model, 32 min for the chain." "${log}"

          n=$(gh api "repos/${REPO}/deployments?sha=${COMMIT}" --jq length)
          expect "no deployment for ${COMMIT}" test "${n}" -eq 0
          [ "${ok}" = true ]

  # The stub runs in the keyless job: no environment is requested, so no
  # deployment is recorded and the commit needs no deployment rule. '$/' would
  # do the same; './' keeps the call readable for older tooling.
  e2e:
    uses: ./.github/workflows/agent-review.yml # zizmor: ignore[self-repository]
    # The ceiling for the called jobs, as in a real caller.
    permissions:
      contents: read
      pull-requests: write
    with:
      harness: stub
      pr: "2983"
      test_repository: GridTools/gt4py
      dry_run: true
      project_name: Self-test
      rule_files: |
        .github/copilot-instructions.md
        AGENTS.md
        CODING_GUIDELINES.md
        src/gt4py/next/AGENTS.md
      prompt_addendum: .github/agent-review-selftest/prompt-addendum.md
      # Lowered caps, to exercise the clamping.
      requests_per_hour: 10
      max_turns: 5
      harness_timeout_minutes: 5

  check:
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reads this run's jobs and the keyless review's log, and the commit's
    # deployments; nothing is written.
    permissions:
      actions: read
      deployments: read
    steps:
      - name: The stub review of the fixture was rendered, not posted
        env:
          E2E: ${{ needs.e2e.result }}
          RESULT: ${{ needs.e2e.outputs.result }}
          HEAD_SHA: ${{ needs.e2e.outputs.head_sha }}
          COMMENT_URL: ${{ needs.e2e.outputs.comment_url }}
        run: |
          echo "e2e='${E2E}' result='${RESULT}' head_sha='${HEAD_SHA}' comment_url='${COMMENT_URL}'"
          [ "${E2E}" = success ] && [ "${RESULT}" = dry-run ] && [ "${HEAD_SHA}" = "${FIXTURE_HEAD_SHA}" ] && [ -z "${COMMENT_URL}" ]

      - name: The keyless job ran the sandbox as configured
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          # Deployments record the PR head, not the merge commit.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ok=true
          expect() { # message command...
            local msg=$1; shift
            if "$@"; then echo "ok    ${msg}"; else echo "::error::FAIL  ${msg}"; ok=false; fi
          }
          jobs=$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs" --jq '.jobs[]' | jq -s .)
          job() { jq -r --arg n "$1" --arg f "$2" '.[] | select(.name == $n) | .[$f]' <<< "${jobs}"; }
          step() { jq -r --arg n "$1" --arg s "$2" '.[] | select(.name == $n) | .steps[] | select(.name == $s) | .conclusion' <<< "${jobs}"; }
          expect "the keyed job did not run" test "$(job 'e2e / review' conclusion)" = skipped
          expect "the keyless job succeeded" test "$(job 'e2e / review-keyless' conclusion)" = success
          expect "nothing was posted" test "$(step 'e2e / publish' 'Publish the review')" = skipped

          # The raw log, through curl: it holds escape sequences, which 'gh'
          # refuses to print. curl drops the token on the redirect to storage.
          id=$(job 'e2e / review-keyless' id)
          [[ "${id}" =~ ^[0-9]+$ ]] || { echo "::error::No keyless review job."; exit 1; }
          for i in 1 2 3 4 5; do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/actions/jobs/${id}/logs" | tr -d '\r' > "${RUNNER_TEMP}/review.log" && break
            sleep $((i * 5))
          done
          log="${RUNNER_TEMP}/review.log"
          expect "fetch run allows only github.com" grep -qE '^[^ ]+ awf\| \[INFO\] Allowed domains: github\.com$' "${log}"
          expect "review run allows no domain" grep -qE '^[^ ]+ awf\| \[INFO\] Allowed domains: ?$' "${log}"
          expect "caps clamped" grep -qF '{"rateLimiting":{"requestsPerMinute":30,"requestsPerHour":10},"maxTurns":5,"agentTimeout":10}' "${log}"
          expect "no key reached AWF" test "$(grep -c 'API proxy enabled: OpenAI=true' "${log}")" -eq 0
          expect "the reset was verified" grep -qF 'are their base versions.' "${log}"

          # The keyless job requests no environment, so no deployment.
          n=$(gh api "repos/${REPO}/deployments?sha=${COMMIT}" --jq length)
          expect "no deployment for ${COMMIT}" test "${n}" -eq 0
          [ "${ok}" = true ]
