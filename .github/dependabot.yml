version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    # AWF is bumped by hand: its setup action's SHA and its 'version:' input
    # (agent-review.yml, 'Set up AWF') must move together, an AWF change is
    # breaking for callers (docs/agent-review.md, Releases), and the AWF
    # probes must be re-run. Dependabot would bump only the SHA, and inside
    # the routine group.
    ignore:
      - dependency-name: github/gh-aw-firewall
  # The self-test's test-only tools (pytest, mypy, PyYAML): uv re-runs the
  # 'uv pip compile --generate-hashes' recorded in requirements.txt, so the
  # hashes stay. A week of cooldown before a new release is proposed.
  - package-ecosystem: uv
    directory: /agent-review/tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-test-tools:
        patterns: ["*"]
